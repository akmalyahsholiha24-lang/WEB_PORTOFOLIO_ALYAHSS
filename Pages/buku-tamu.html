<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu - Akmalyah Sholiha Salsabila</title>
  <!-- Menghubungkan ke CSS gabungan -->
  <link rel="stylesheet" href="../CSS/style.css">
  <style>
    /* Styling tambahan untuk daftar pesan/komentar */
    .comments-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px dashed #eee;
    }
    .comment-card {
      background-color: #f9f9f9;
      border-left: 4px solid #ff7b9c;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .comment-author {
      font-weight: bold;
      color: #333;
    }
    .comment-date {
      font-size: 0.8rem;
      color: #777;
    }
    .comment-body {
      color: #555;
      font-size: 0.95rem;
      white-space: pre-line;
    }
    .loading-text {
      text-align: center;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Nama -->
    <header class="header">
      <span class="heart-icon">📖</span>
      <h1>Buku Tamu</h1>
      <p class="subtitle">Tinggalkan pesan atau sapaan untuk Alyah!</p>
    </header>

    <!-- Form Buku Tamu -->
    <section class="guestbook-section">
      <form id="guestbook-form">
        <div class="form-group">
          <label for="nama">Nama Lengkap *</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama kamu" required>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="contoh@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="pesan">Pesan / Kesan *</label>
          <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesan manis kamu di sini..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Kirim Pesan 💌</button>
      </form>

      <!-- Pesan Notifikasi -->
      <div id="status-message"></div>

      <!-- Wadah Daftar Komentar -->
      <section class="comments-section">
        <h3>💬 Pesan & Kesan Teman-teman</h3>
        <div id="comments-container">
          <p class="loading-text">Memuat pesan...</p>
        </div>
      </section>

      <div style="text-align: center; margin-top: 20px;">
        <a href="../index.html" class="back-btn">← Kembali ke Beranda</a>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p><i>Website profil ini dibuat khusus untuk latihan HTML & CSS</i></p>
    </footer>
  </div>

  <script>
    // URL Web App Google Apps Script kamu
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxGx1nu9fHLG1b06Y3Su95cNY5A_CBbKqP4PYhgXp-R2TQfENEWBngL0a9QQPbiqVvZ8Q/exec';
    
    const form = document.getElementById('guestbook-form');
    const btnSubmit = document.getElementById('btn-submit');
    const statusMsg = document.getElementById('status-message');
    const commentsContainer = document.getElementById('comments-container');

    // Fungsi untuk mengambil dan menampilkan pesan dari Google Sheets
    function loadComments() {
      fetch(scriptURL)
        .then(response => response.json())
        .then(data => {
          if (!data || data.length === 0) {
            commentsContainer.innerHTML = '<p class="loading-text">Belum ada pesan. Jadilah yang pertama!</p>';
            return;
          }

          // Tampilkan pesan dalam urutan terbaru di atas
          commentsContainer.innerHTML = data.reverse().map(item => `
            <div class="comment-card">
              <div class="comment-header">
                <span class="comment-author">👤 ${escapeHTML(item.nama)}</span>
                <span class="comment-date">${escapeHTML(item.tanggal)}</span>
              </div>
              <div class="comment-body">${escapeHTML(item.pesan)}</div>
            </div>
          `).join('');
        })
        .catch(error => {
          console.error('Error saat memuat pesan:', error);
          commentsContainer.innerHTML = '<p class="loading-text">Gagal memuat daftar pesan.</p>';
        });
    }

    // Fungsi pengaman sederhana untuk mencegah serangan XSS
    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, match => {
        const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return escapeMap[match];
      });
    }

    // Memuat daftar pesan saat halaman pertama kali dibuka
    document.addEventListener('DOMContentLoaded', loadComments);

    // Kirim Formulir
    form.addEventListener('submit', e => {
      e.preventDefault();
      
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Mengirim...';
      statusMsg.style.display = 'none';

      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Kirim Pesan 💌';
          
          statusMsg.className = 'status-success';
          statusMsg.innerText = 'Terima kasih! Pesan kamu berhasil terkirim. ✨';
          statusMsg.style.display = 'block';

          form.reset();
          
          // Refresh/muat ulang daftar pesan agar pesan baru langsung muncul
          loadComments();
        })
        .catch(error => {
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Kirim Pesan 💌';
          
          statusMsg.className = 'status-error';
          statusMsg.innerText = 'Gagal mengirim pesan. Silakan coba lagi.';
          statusMsg.style.display = 'block';
          
          console.error('Error!', error.message);
        });
    });
  </script>

</body>
</html>
